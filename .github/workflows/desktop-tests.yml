name: Desktop tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    env:
      DORA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(github.event_name == 'pull_request' && '["candidate"]' || '["release","directory","update"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the candidate from the reviewed commit
        if: matrix.check == 'candidate'
        run: npm run build
      - name: Download published plugin files
        if: matrix.check != 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$(node -p 'require("./manifest.json").version')" --dir dist \
            --pattern main.js --pattern manifest.json --pattern styles.css
          cmp manifest.json dist/manifest.json
      - name: Fetch the previous public release for the upgrade vault
        if: matrix.check != 'directory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-results/previous
          gh release download 1.0.1 --dir test-results/previous --pattern main.js --pattern manifest.json --pattern styles.css
      - name: Prepare Obsidian and its virtual display
        run: |
          package="$RUNNER_TEMP/obsidian.deb"
          curl --fail --show-error --silent --location --retry 3 \
            https://github.com/obsidianmd/obsidian-releases/releases/download/v1.15.1/obsidian_1.15.1_amd64.deb -o "$package"
          echo "f77b6dfc8c040214f2febad2b1b9b051b6a838a47b0f4fb90a31cfcb79b8fcec  $package" | sha256sum -c -
          packages=("$package" xvfb xauth openbox fonts-noto-cjk)
          if ! sudo apt-get install -y --no-install-recommends "${packages[@]}"; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
      - name: Test the release in isolated vaults
        if: matrix.check == 'release' || matrix.check == 'candidate'
        run: xvfb-run -n 2 -s '-screen 0 1440x1000x24' sh -ec 'openbox >/dev/null 2>&1 & exec npm run test:native'
      - name: Search, install and enable in the community directory
        if: matrix.check == 'directory'
        run: xvfb-run -n 2 -s '-screen 0 1440x1000x24' sh -ec 'openbox >/dev/null 2>&1 & exec npm run test:native -- store'
      - name: Update the installed 1.0.1 plugin through Obsidian
        if: matrix.check == 'update'
        run: xvfb-run -n 2 -s '-screen 0 1440x1000x24' sh -ec 'openbox >/dev/null 2>&1 & exec npm run test:native -- market-update'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.check }}
          path: test-results/native
          if-no-files-found: ignore
